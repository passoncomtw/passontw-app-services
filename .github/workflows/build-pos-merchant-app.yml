name: Build POS Merchant App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-macos:
    runs-on: mac-mini-build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: cmd/pos-merchant-app/yarn.lock

      - name: 💾 Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 💾 Cache Vite
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📝 Prepare .env
        working-directory: cmd/pos-merchant-app
        run: |
          printf "%s" "$DEV_POS_MERCHANT_APP_ENV" > .env
        env:
          DEV_POS_MERCHANT_APP_ENV: ${{ secrets.DEV_POS_MERCHANT_APP_ENV }}

      - name: 🔢 Set version
        working-directory: cmd/pos-merchant-app
        id: set-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="0.0.1"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          node << EOF
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          EOF
          
          echo "Version set to: $VERSION"

      - name: 🔧 Increase file descriptor limit
        run: |
          echo "Current limits:"
          ulimit -n
          echo "Increasing file descriptor limit..."
          ulimit -n 10240
          echo "New limit:"
          ulimit -n

      - name: 🏗️ Build macOS app
        working-directory: cmd/pos-merchant-app
        run: yarn install && yarn build:fast --mac
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: 📊 List build outputs
        working-directory: cmd/pos-merchant-app
        run: |
          echo "=== Build outputs ==="
          ls -lh dist/*.dmg || true
          ls -lh dist/*.zip || true
          du -sh dist

      - name: 📤 Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: cmd/pos-merchant-app/dist/*-x64.dmg
          if-no-files-found: error

      - name: 📤 Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: cmd/pos-merchant-app/dist/*-arm64.dmg
          if-no-files-found: error

      - name: 📤 Upload macOS x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-zip
          path: cmd/pos-merchant-app/dist/*-x64.zip
          if-no-files-found: error

      - name: 📤 Upload macOS arm64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-zip
          path: cmd/pos-merchant-app/dist/*-arm64.zip
          if-no-files-found: error

  build-windows:
    runs-on: mac-mini-build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: cmd/pos-merchant-app/yarn.lock

      - name: 💾 Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 💾 Cache Vite
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📝 Prepare .env
        working-directory: cmd/pos-merchant-app
        run: |
          printf "%s" "$DEV_POS_MERCHANT_APP_ENV" > .env
        env:
          DEV_POS_MERCHANT_APP_ENV: ${{ secrets.DEV_POS_MERCHANT_APP_ENV }}

      - name: 🔢 Set version
        working-directory: cmd/pos-merchant-app
        id: set-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="0.0.1"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          node << EOF
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          EOF
          
          echo "Version set to: $VERSION"

      - name: 🏗️ Build Windows app
        working-directory: cmd/pos-merchant-app
        run: yarn install && yarn build:fast --win
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: 📊 List build outputs
        working-directory: cmd/pos-merchant-app
        run: |
          echo "=== Build outputs ==="
          ls -lh dist/*.exe || true
          echo "=== Disk usage ==="
          ls -lh dist || true

      - name: 📤 Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: cmd/pos-merchant-app/dist/*-x64.exe
          if-no-files-found: error

      - name: 📤 Upload Windows ia32 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-ia32-installer
          path: cmd/pos-merchant-app/dist/*-ia32.exe
          if-no-files-found: error

  build-linux:
    runs-on: mac-mini-build
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: cmd/pos-merchant-app/yarn.lock

      - name: 💾 Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: 💾 Cache Vite
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: cmd/pos-merchant-app/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('cmd/pos-merchant-app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 📝 Prepare .env
        working-directory: cmd/pos-merchant-app
        run: |
          printf "%s" "$DEV_POS_MERCHANT_APP_ENV" > .env
        env:
          DEV_POS_MERCHANT_APP_ENV: ${{ secrets.DEV_POS_MERCHANT_APP_ENV }}

      - name: 🔢 Set version
        working-directory: cmd/pos-merchant-app
        id: set-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="0.0.1"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          node << EOF
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          EOF
          
          echo "Version set to: $VERSION"

      - name: 🏗️ Build Linux app
        working-directory: cmd/pos-merchant-app
        run: yarn install && yarn build:fast --linux
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: 📊 List build outputs
        working-directory: cmd/pos-merchant-app
        run: |
          echo "=== Build outputs ==="
          ls -lh dist/*.AppImage || true
          ls -lh dist/*.deb || true
          du -sh dist

      - name: 📤 Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: cmd/pos-merchant-app/dist/*.AppImage
          if-no-files-found: error

      - name: 📤 Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: cmd/pos-merchant-app/dist/*.deb
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: mac-mini-build
    
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📊 List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -R artifacts/
          echo "=== File sizes ==="
          du -sh artifacts/*

      - name: 📦 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version || '0.0.1' }}
          name: v${{ github.event.inputs.version || '0.0.1' }}
          files: |
            artifacts/macos-x64-dmg/*.dmg
            artifacts/macos-arm64-dmg/*.dmg
            artifacts/macos-x64-zip/*.zip
            artifacts/macos-arm64-zip/*.zip
            artifacts/windows-x64-installer/*.exe
            artifacts/windows-ia32-installer/*.exe
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-deb/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 PassonTW POS Merchant App Release
            
            ### 📦 下載選項
            
            #### macOS
            - **Apple Silicon (M1/M2/M3)**: 下載 `*-arm64.dmg`
            - **Intel Mac**: 下載 `*-x64.dmg`
            
            #### Windows
            - **64-bit**: 下載 `*-x64.exe`
            - **32-bit**: 下載 `*-ia32.exe`
            
            #### Linux
            - **通用**: 下載 `*.AppImage`（適用於所有 Linux 發行版）
            - **Debian/Ubuntu**: 下載 `*.deb`
            
            ### 🔍 如何確認您的系統架構
            
            **macOS**:
            ```bash
            uname -m
            # 輸出 arm64 → 下載 arm64 版本
            # 輸出 x86_64 → 下載 x64 版本
            ```
            
            **Windows**:
            - 系統設定 → 系統 → 關於 → 系統類型
            
            ### ✨ 新功能與改進
            
            查看下方的自動生成的更新日誌。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

