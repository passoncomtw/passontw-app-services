name: Build and Deploy iOS to TestFlight

on:
  push:
    # tags:
    #   - 'v*.*.*'  # 當推送版本標籤時觸發，例如 v1.0.0
    # branches:
    #   - develop
  workflow_dispatch:  # 允許手動觸發
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-submit:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: cmd/token-app-service/yarn.lock

      - name: 📦 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 📦 Install dependencies
        working-directory: ./cmd/token-app-service
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: 🔢 Set build number from Git commit
        working-directory: ./cmd/token-app-service
        id: set-build-number
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short=7 HEAD || date +%s | tail -c 7)
          echo "build_number=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          
          node << EOF
          const fs = require('fs');
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.ios.buildNumber = '$GIT_COMMIT_SHORT';
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\\n');
          EOF
          
          echo "Build number set to: $GIT_COMMIT_SHORT"

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 🏗️ Build iOS with EAS and Submit to TestFlight
        working-directory: ./cmd/token-app-service
        id: build
        run: |
          BUILD_OUTPUT=$(eas build --platform ios --profile production --non-interactive --auto-submit --json 2>&1 || eas build --platform ios --profile production --non-interactive --auto-submit)
          
          # 嘗試從輸出中提取建置 ID
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4 || \
                     echo "$BUILD_OUTPUT" | grep -o 'Build ID: [a-f0-9-]*' | cut -d' ' -f3 || \
                     echo "$BUILD_OUTPUT" | grep -o 'https://expo.dev/.*/builds/[a-f0-9-]*' | sed 's/.*builds\///')
          
          if [ -n "$BUILD_ID" ]; then
            echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
            echo "Found build ID from build output: $BUILD_ID"
          else
            echo "Could not extract build ID from output, will try to get it from build list"
          fi
          
          echo "$BUILD_OUTPUT"

      - name: ⏳ Wait for build and submission to complete
        working-directory: ./cmd/token-app-service
        id: wait-build
        run: |
          BUILD_ID="${{ steps.build.outputs.build_id }}"
          
          if [ -z "$BUILD_ID" ]; then
            echo "Waiting for build to appear in list..."
            for i in {1..30}; do
              sleep 5
              BUILD_JSON=$(eas build:list --platform ios --limit 1 --json 2>&1)
              if [ $? -eq 0 ]; then
                BUILD_ID=$(echo "$BUILD_JSON" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                [ -n "$BUILD_ID" ] && break
              else
                echo "Warning: eas build:list failed (attempt $i/30), will retry..."
              fi
              echo "Attempt $i/30: Build not found yet, waiting..."
            done
          fi
          
          [ -z "$BUILD_ID" ] && { echo "Error: Could not find build ID after 30 attempts"; exit 1; }
          
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Waiting for build $BUILD_ID to complete and submit to TestFlight..."
          eas build:wait --id $BUILD_ID --timeout 3600
          
          BUILD_INFO=$(eas build:view --id $BUILD_ID --json 2>/dev/null || eas build:list --platform ios --limit 1 --json)
          BUILD_URL=$(echo $BUILD_INFO | grep -o '"artifacts":{"buildUrl":"[^"]*"' | cut -d'"' -f6 || \
                      echo $BUILD_INFO | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4 || \
                      echo $BUILD_INFO | grep -o '"buildUrl":"[^"]*"' | head -1 | cut -d'"' -f4 || \
                      echo "https://expo.dev/accounts/tomas/projects/token-app-service/builds/$BUILD_ID")
          
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          
          echo "Build ID: $BUILD_ID" > build-info.txt
          echo "Build Number: ${{ steps.set-build-number.outputs.build_number }}" >> build-info.txt
          echo "Build URL: $BUILD_URL" >> build-info.txt
          echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> build-info.txt
          echo "Platform: iOS" >> build-info.txt
          echo "Profile: production" >> build-info.txt
          echo "✅ Build completed and submitted to TestFlight automatically"

      - name: 📝 Create build summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏗️ iOS Build Information
          
          | Item | Value |
          |------|-------|
          | Build Number | \`${{ steps.set-build-number.outputs.build_number }}\` |
          | Build ID | \`${{ steps.wait-build.outputs.build_id }}\` |
          | Build URL | [${{ steps.wait-build.outputs.build_url }}](${{ steps.wait-build.outputs.build_url }}) |
          
          ### 📥 Download
          [${{ steps.wait-build.outputs.build_url }}](${{ steps.wait-build.outputs.build_url }})
          EOF

      - name: 📊 Upload build logs and info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-info
          path: |
            ./cmd/token-app-service/.eas/**
            ./cmd/token-app-service/build-info.txt
          retention-days: 30

      - name: 🧹 Clean up build artifacts
        if: always()
        working-directory: ./cmd/token-app-service
        run: |
          echo "Cleaning up build artifacts and temporary files..."
          
          # 清理建置產物和日誌
          rm -rf build-info.txt
          rm -rf .eas/build
          rm -rf .eas/*.log
          rm -rf ios/build
          rm -rf android/build
          rm -rf android/app/build
          
          # 清理 node_modules（下次會從快取或重新安裝）
          rm -rf node_modules
          
          # 清理 Expo 相關快取和臨時檔案
          rm -rf .expo
          rm -rf .expo-shared
          rm -rf dist
          rm -rf dist-electron
          
          # 清理 Metro bundler 快取
          rm -rf .metro
          rm -rf $TMPDIR/metro-* 2>/dev/null || true
          rm -rf $TMPDIR/haste-* 2>/dev/null || true
          
          # 清理其他臨時檔案
          find . -maxdepth 3 -name "*.log" -delete 2>/dev/null || true
          find . -maxdepth 3 -name "*.tmp" -delete 2>/dev/null || true
          find . -maxdepth 3 -name "*.swp" -delete 2>/dev/null || true
          find . -maxdepth 3 -name "*.swo" -delete 2>/dev/null || true
          find . -maxdepth 3 -name ".DS_Store" -delete 2>/dev/null || true
          
          # 還原 app.json（移除建置時修改的 buildNumber）
          git checkout app.json 2>/dev/null || echo "Note: app.json will be reset on next checkout"
          
          echo "✅ Cleanup completed. Next build will start fresh (caches preserved)."

