name: Build and Deploy iOS to TestFlight

on:
  push:
    # tags:
    #   - 'v*.*.*'  # 當推送版本標籤時觸發，例如 v1.0.0
    # branches:
    #   - develop
  workflow_dispatch:  # 允許手動觸發
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-submit:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: cmd/token-app-service/yarn.lock

      - name: 📦 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 📦 Install dependencies
        working-directory: ./cmd/token-app-service
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: 🔢 Set build number from Git commit
        working-directory: ./cmd/token-app-service
        id: set-build-number
        run: |
          GIT_COMMIT_SHORT=$(git rev-parse --short=7 HEAD || date +%s | tail -c 7)
          echo "build_number=$GIT_COMMIT_SHORT" >> $GITHUB_OUTPUT
          
          node << EOF
          const fs = require('fs');
          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.ios.buildNumber = '$GIT_COMMIT_SHORT';
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\\n');
          EOF
          
          echo "Build number set to: $GIT_COMMIT_SHORT"

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 🏗️ Build iOS with EAS
        working-directory: ./cmd/token-app-service
        run: |
          eas build --platform ios --profile production --non-interactive

      - name: ⏳ Wait for build to complete
        working-directory: ./cmd/token-app-service
        id: wait-build
        run: |
          sleep 10
          BUILD_ID=$(eas build:list --platform ios --limit 1 --json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -z "$BUILD_ID" ] && { echo "Error: Could not find build ID"; exit 1; }
          
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          eas build:wait --id $BUILD_ID --timeout 3600
          
          BUILD_INFO=$(eas build:view --id $BUILD_ID --json 2>/dev/null || eas build:list --platform ios --limit 1 --json)
          BUILD_URL=$(echo $BUILD_INFO | grep -o '"artifacts":{"buildUrl":"[^"]*"' | cut -d'"' -f6 || \
                      echo $BUILD_INFO | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4 || \
                      echo $BUILD_INFO | grep -o '"buildUrl":"[^"]*"' | head -1 | cut -d'"' -f4 || \
                      echo "https://expo.dev/accounts/tomas/projects/token-app-service/builds/$BUILD_ID")
          
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          
          cat > build-info.txt << EOF
          Build ID: $BUILD_ID
          Build Number: ${{ steps.set-build-number.outputs.build_number }}
          Build URL: $BUILD_URL
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Platform: iOS
          Profile: production
          EOF

      - name: 📤 Submit to TestFlight
        working-directory: ./cmd/token-app-service
        env:
          EXPO_NO_DOTENV: 1
          EAS_NO_VCS: 1
        run: |
          BUILD_ID="${{ steps.wait-build.outputs.build_id }}"
          [ -z "$BUILD_ID" ] && BUILD_ID=$(eas build:list --platform ios --limit 1 --json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -z "$BUILD_ID" ] && { echo "Error: Could not determine build ID"; exit 1; }
          
          set +e
          SUBMIT_OUTPUT=$(eas submit --platform ios \
            --id $BUILD_ID \
            --non-interactive \
            --apple-id ${{ secrets.APPLE_ID_TOKEN_APP }} \
            --app-specific-password ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }} \
            --asc-app-id ${{ secrets.APPLE_APP_ID_TOKEN_APP }} 2>&1)
          EXIT_CODE=$?
          set -e
          
          echo "$SUBMIT_OUTPUT"
          [ $EXIT_CODE -ne 0 ] && echo "$SUBMIT_OUTPUT" | grep -qi "already submitted" && exit 0
          [ $EXIT_CODE -ne 0 ] && exit $EXIT_CODE
          echo "✅ Successfully submitted to TestFlight"

      - name: 📝 Create build summary
        if: always()
        run: |
          echo "## 🏗️ iOS Build Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number (Git Commit) | \`${{ steps.set-build-number.outputs.build_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build ID | \`${{ steps.wait-build.outputs.build_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build URL | [${{ steps.wait-build.outputs.build_url }}](${{ steps.wait-build.outputs.build_url }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the build from: [${{ steps.wait-build.outputs.build_url }}](${{ steps.wait-build.outputs.build_url }})" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Upload build logs and info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-info
          path: |
            ./cmd/token-app-service/.eas/**
            ./cmd/token-app-service/build-info.txt
          retention-days: 30

