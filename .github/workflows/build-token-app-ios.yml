name: Build and Deploy iOS to TestFlight

on:
  push:
    tags:
      - 'v*.*.*'  # 當推送版本標籤時觸發，例如 v1.0.0
  workflow_dispatch:  # 允許手動觸發
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-submit:
    name: Build iOS and Submit to TestFlight
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: cmd/token-app-service/yarn.lock

      - name: 📦 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 📦 Install dependencies
        working-directory: ./cmd/token-app-service
        run: yarn install --frozen-lockfile

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN_TOKEN_APP }}

      - name: 🔐 Configure Apple Credentials
        uses: expo/apple-credentials@v1
        with:
          bundle-identifier: com.passon.ecoinwallet
          apple-id: ${{ secrets.APPLE_ID_TOKEN_APP }}
          app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: 🏗️ Build iOS with EAS
        working-directory: ./cmd/token-app-service
        run: |
          eas build --platform ios \
            --profile production \
            --non-interactive \
            --no-wait

      - name: ⏳ Wait for build to complete
        working-directory: ./cmd/token-app-service
        run: |
          echo "Waiting for build to complete..."
          # 等待幾秒讓構建開始
          sleep 10
          # 取得最新的構建 ID
          BUILD_ID=$(eas build:list --platform ios --limit 1 --json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$BUILD_ID" ]; then
            echo "Error: Could not find build ID"
            exit 1
          fi
          echo "Build ID: $BUILD_ID"
          eas build:wait --id $BUILD_ID --timeout 3600

      - name: 📤 Submit to TestFlight
        working-directory: ./cmd/token-app-service
        run: |
          eas submit --platform ios \
            --latest \
            --non-interactive \
            --apple-id ${{ secrets.APPLE_ID_TOKEN_APP }} \
            --app-specific-password ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }} \
            --asc-app-id ${{ secrets.APPLE_APP_ID_TOKEN_APP }}

      - name: 📊 Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            ./cmd/token-app-service/.eas/**
          retention-days: 30

